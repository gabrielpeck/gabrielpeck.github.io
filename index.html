
<!DOCTYPE html>
<html>

<head>
    <title>Vivero</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
 

    <style>
        .contenedor {
    	display: grid;
    	grid-template-columns: repeat(4, 1fr);
    	gap: 15px;
	}

	.contenedor img {
    	width: 100%;
    	height: 200px;
    	object-fit: cover;
    	display: block;
	}

        .logo {
            height: 60px;
            width: auto;
	    max-width: unset;
        }
	.planta {
   	 text-align: center;
	}

	.planta p {
    	font-weight: bold;
    	margin-top: 8px;
	}
    </style>
</head>

<body>

    <header>
		<nav class="nav">
		  <a class="nav-link active" aria-current="page" href="#">Active</a>
		  <a class="nav-link" href="#">Link</a>
		  <a class="nav-link" href="#">Link</a>
		  <a class="nav-link disabled" aria-disabled="true">Disabled</a>
		</nav>
        <img class="logo" src="fotos/logo-vivero.jpg" alt="Logo del vivero">
        <h1>Vivero y consejos para tus plantas.</h1>
    </header>

    <main>
		<div class="container">
		    <div class="row g-3">
		
		        <div class="col-12 col-sm-6 col-lg-3">
		            <div class="card h-100">
		                <img src="fotos/margaritas.JPG"
		                     class="card-img-top"
		                     alt="Margaritas">
		                <div class="card-body text-center">
		                    <p class="card-text fw-bold">Margaritas</p>
		                </div>
		            </div>
		        </div>
		
		        <div class="col-12 col-sm-6 col-lg-3">
		            <div class="card h-100">
		                <img src="fotos/rosas.JPG"
		                     class="card-img-top"
		                     alt="Rosas">
		                <div class="card-body text-center">
		                    <p class="card-text fw-bold">Rosas</p>
		                </div>
		            </div>
		        </div>
		
		        <div class="col-12 col-sm-6 col-lg-3">
		            <div class="card h-100">
		                <img src="fotos/jazmin.JPG"
		                     class="card-img-top"
		                     alt="Jazmín">
		                <div class="card-body text-center">
		                    <p class="card-text fw-bold">Jazmín</p>
		                </div>
		            </div>
		        </div>
		
		        <div class="col-12 col-sm-6 col-lg-3">
		            <div class="card h-100">
		                <img src="fotos/clavel.JPG"
		                     class="card-img-top"
		                     alt="Clavel">
		                <div class="card-body text-center">
		                    <p class="card-text fw-bold">Clavel</p>
		                </div>
		            </div>
		        </div>
		
		    </div>
		</div>

    <p>
        Estas son algunas de las flores que crecen en el vivero.
        Necesitan luz diaria y riego moderado para mantenerse sanas.
    </p>
    </main>

    <footer>
        <p>Autor: Gabriel - 2026</p>
    </footer>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
