
<!DOCTYPE html>
<html>

<head>
    <title>Vivero</title>
    <meta charset="UTF-8">

    <style>
        .contenedor {
    	display: grid;
    	grid-template-columns: repeat(4, 1fr);
    	gap: 15px;
	}

	.contenedor img {
    	width: 100%;
    	height: 200px;
    	object-fit: cover;
    	display: block;
	}

        .logo {
            height: 60px;
            width: auto;
	    max-width: unset;
        }
	.planta {
   	 text-align: center;
	}

	.planta p {
    	font-weight: bold;
    	margin-top: 8px;
	}
    </style>
</head>

<body>

    <header>
        <img class="logo" src="fotos/logo-vivero.JPG" alt="Logo del vivero">
        <h1>Vivero y consejos para tus plantas.</h1>
    </header>

    <main>
     <div class="contenedor">

    	<div class="planta">
        	<img src="fotos/margaritas.JPG" alt="Flor de margarita blanca">
        	<p>Margaritas</p>
    	</div>

    	<div class="planta">
        	<img src="fotos/rosas.JPG" alt="Flor de rosa roja">
        	<p>Rosas</p>
    	</div>

    	<div class="planta">
        	<img src="fotos/jazmin.JPG" alt="Flor de jazmín blanca">
        	<p>Jazmín</p>
    	</div>

    	<div class="planta">
        	<img src="fotos/clavel.JPG" alt="Flor de clavel blanca">
        	<p>Clavel</p>
    	</div>
     </div>

    <p>
        Estas son algunas de las flores que crecen en el vivero.
        Necesitan luz diaria y riego moderado para mantenerse sanas.
    </p>
    </main>

    <footer>
        <p>Autor: Gabriel - 2026</p>
    </footer>

</body>
</html>
